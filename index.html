<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back End · группа A1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23152033'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Segoe UI,sans-serif' font-size='13' font-weight='700' fill='%23e3925d'%3EA1%3C/text%3E%3C/svg%3E">
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css" disabled>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5c6b7a;
      --paper: #f6f3ee;
      --sheet: #fffdf9;
      --line: #e4ddd2;
      --link: #1d5c8a;
      --code-bg: #f3efe6;
      --th: #f3eee6;
      --accent: #c4652d;
      --sidebar: 300px;
      --header: 58px;
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --ink: #ebe6dc;
      --muted: #b1a89c;
      --paper: #12161c;
      --sheet: #1b212b;
      --line: #2d3644;
      --link: #8eb8e0;
      --code-bg: #121820;
      --th: #232b38;
      --accent: #e3925d;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #app { display: flex; height: 100%; }
    #sidebar {
      width: var(--sidebar);
      flex: none;
      background: #152033;
      color: #d5dbe3;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 16px 16px 10px;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 10px;
      background: #24344c; color: #e3925d;
      display: grid; place-items: center; font-weight: 700;
    }
    .brand strong { display: block; color: #fff; font-size: 15px; }
    .brand span { color: #9aabbd; font-size: 12px; }
    .progress { padding: 0 16px 12px; }
    .progress-row { display: flex; justify-content: space-between; font-size: 12px; color: #9aabbd; margin-bottom: 6px; }
    .track { height: 4px; background: #2a3b52; border-radius: 99px; overflow: hidden; }
    .track i { display: block; height: 100%; width: 0; background: #e3925d; }
    .search { padding: 0 12px 10px; }
    .search input {
      width: 100%;
      background: #0f1826;
      border: 1px solid #2c3d55;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
    }
    #nav { overflow: auto; padding: 0 8px 12px; flex: 1; }
    .module {
      margin: 14px 8px 6px;
      color: #a9b7c6;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .lesson { display: flex; align-items: flex-start; gap: 4px; }
    .mark, .open-btn { background: none; border: 0; cursor: pointer; }
    .mark {
      width: 22px; height: 22px; margin-top: 6px; border-radius: 50%;
      border: 1.5px solid #6e8298; color: transparent;
      display: grid; place-items: center; padding: 0; flex: none;
    }
    .lesson.done .mark { background: #2a9d8f; border-color: #2a9d8f; color: #fff; }
    .open-btn {
      flex: 1; display: grid; grid-template-columns: 2.5em 1fr; gap: 6px;
      text-align: left; color: #d5dbe3; padding: 7px 8px; border-radius: 8px;
    }
    .lesson.active .open-btn { background: rgba(255,255,255,.08); color: #fff; }
    .num { color: #e39a6a; font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
    .hit { grid-column: 1 / -1; color: #9aabbd; font-size: 12px; line-height: 1.35; }
    .hit mark { background: #6b4e2e; color: #fff; border-radius: 2px; }
    .side-note { margin: 0; padding: 10px 16px 14px; color: #7f90a4; font-size: 12px; }
    .empty { padding: 12px; color: #9aabbd; font-size: 14px; }
    #main { flex: 1; min-width: 0; overflow: auto; }
    #topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      min-height: var(--header); padding: 8px 18px;
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    #readbar { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--accent); }
    .crumb { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex: 1; }
    .crumb b { font-weight: 650; }
    .crumb span { color: var(--muted); font-size: 13px; }
    #menu { display: none; }
    .icon-btn, .done-btn {
      border: 1px solid var(--line); background: var(--sheet);
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
    }
    .done-btn.is-done { background: #1f6f6a; color: #fff; border-color: #1f6f6a; }
    #stage {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 230px;
      gap: 28px;
      padding: 28px 0 72px;
    }
    .prose { font-size: 17.5px; line-height: 1.65; }
    .prose h1, .prose h2, .prose h3, .prose h4 { line-height: 1.25; scroll-margin-top: 76px; max-width: 22em; }
    .prose h1 { font-size: 2rem; margin: 0 0 .6em; }
    .prose h2 { font-size: 1.45rem; margin: 1.6em 0 .45em; }
    .prose h3 { font-size: 1.12rem; margin: 1.3em 0 .35em; }
    .prose p, .prose ul, .prose ol, .prose blockquote { max-width: 68ch; }
    .prose a { color: var(--link); }
    .prose blockquote { margin: 1em 0; padding: .1em 0 .1em 1em; border-left: 3px solid var(--accent); color: var(--muted); }
    .prose code { font-family: Consolas, "Cascadia Code", monospace; font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
    .codeblock { margin: 1em 0 1.2em; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
    .codeblock-bar { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .codeblock-bar button { border: 0; background: none; cursor: pointer; color: var(--link); }
    .codeblock pre { margin: 0; padding: 12px 14px; overflow: auto; }
    .prose .codeblock code, .prose pre code { background: none; padding: 0; font-size: .92rem; }
    .table-wrap { overflow: auto; margin: 1em 0 1.2em; border: 1px solid var(--line); border-radius: 10px; }
    .prose table { width: 100%; border-collapse: collapse; font-size: .92rem; line-height: 1.45; }
    .prose th, .prose td { padding: .55em .75em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    .prose th { background: var(--th); font-weight: 650; }
    .prose tr:last-child td { border-bottom: 0; }
    .diagram { background: #fffdfb; color: #1c2430; border: 1px solid #e6dfd4; border-radius: 12px; padding: 12px 8px; overflow: auto; margin: 1em 0 1.2em; }
    .diagram svg { max-width: 100%; height: auto; }
    .diagram-note { color: #8a5a32; font-size: 13px; margin: 8px 12px; }
    #outline { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; font-size: 13px; }
    #outline p { margin: 0 0 8px; color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    #outline a { display: block; color: var(--muted); text-decoration: none; padding: 4px 0 4px 10px; border-left: 2px solid var(--line); }
    #outline a.d1 { font-weight: 650; color: var(--ink); }
    #outline a.d3 { padding-left: 20px; }
    #outline a.active { color: var(--ink); border-left-color: var(--accent); }
    #pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
    #pager button {
      display: flex; flex-direction: column; gap: 4px; text-align: left;
      padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--sheet); cursor: pointer;
    }
    #pager .next { text-align: right; align-items: flex-end; }
    #pager small { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
    #backdrop { display: none; }
    #gate {
      display: none; min-height: 100%; place-items: center; padding: 24px;
      background: #152033; color: #e8edf3;
    }
    html.needs-files #gate, html.gate-open #gate { display: grid; }
    html.needs-files #app, html.gate-open #app { display: none; }
    .gate-card { width: min(560px, 100%); }
    .gate-card h1 { margin: 0 0 8px; font-size: 1.8rem; }
    .gate-card p { color: #c5d0dc; line-height: 1.5; }
    .pick {
      display: inline-block; margin: 8px 0 18px; background: #e3925d; color: #1c140e;
      font-weight: 700; padding: 10px 14px; border-radius: 10px; cursor: pointer;
    }
    .gate-card pre {
      background: #0f1826; padding: 10px 12px; border-radius: 8px; overflow: auto;
    }
    .gate-error { color: #f0c7a2; }
    .loading { color: var(--muted); }
    @media (max-width: 980px) {
      #stage { grid-template-columns: 1fr; width: min(800px, calc(100% - 28px)); }
      #outline { display: none; }
    }
    @media (max-width: 760px) {
      #menu { display: inline-flex; }
      #sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; transform: translateX(-105%); transition: transform .18s ease; }
      #sidebar.open { transform: none; }
      #sidebar.open + #backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 25; }
      #pager { grid-template-columns: 1fr; }
      #pager .next { text-align: left; align-items: flex-start; }
    }
  </style>
  <script>
    (function () {
      try {
        if (JSON.parse(localStorage.getItem("a1-course-progress-v1") || "{}").theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
      if (location.protocol === "file:") document.documentElement.classList.add("needs-files");
    })();
  </script>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <div class="logo" style="margin-bottom:14px">A1</div>
      <h1>Материалы курса</h1>
      <p id="gate-lead">Выберите папку или запустите сервер через Node.</p>
      <p class="gate-error" id="gate-error"></p>
      <label class="pick">Выбрать папку с уроками
        <input id="pick-dir" type="file" webkitdirectory multiple hidden>
      </label>
      <p>В этой папке:</p>
      <pre>node server.js</pre>
      <p>Затем откройте http://localhost:8000</p>
    </div>
  </div>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo">A1</div>
        <div>
          <strong>Back End</strong>
          <span>для Front End · группа A1</span>
        </div>
      </div>
      <div class="progress">
        <div class="progress-row"><span>Пройдено</span><span><b id="done-count">0</b> / <span id="total-count">18</span></span></div>
        <div class="track"><i id="done-bar"></i></div>
      </div>
      <div class="search"><input id="q" type="search" placeholder="Поиск по курсу" autocomplete="off" spellcheck="false"></div>
      <nav id="nav"></nav>
      <p class="side-note">Отметки сохраняются в этом браузере. «Дальше» отмечает урок пройденным.</p>
    </aside>
    <div id="backdrop"></div>
    <div id="main">
      <header id="topbar">
        <div id="readbar"></div>
        <button id="menu" class="icon-btn" type="button" aria-label="Оглавление">Меню</button>
        <div class="crumb">
          <b id="crumb-module">Курс</b>
          <span id="crumb-meta"></span>
        </div>
        <button id="theme" class="icon-btn" type="button">Тема</button>
        <button id="done" class="done-btn" type="button">Отметить пройденным</button>
      </header>
      <div id="stage">
        <div>
          <article id="content" class="prose"><p class="loading">Загрузка…</p></article>
          <nav id="pager"></nav>
        </div>
        <aside id="outline"></aside>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.min.js"></script>
  <script>
    const KEY = "a1-course-progress-v1";
    const MODULES = [
      { id: "0", title: "Введение" },
      { id: "1", title: "Работа с пользователями" },
      { id: "2", title: "Трансформация файлов" }
    ];
    const LESSONS = [
      ["0.0", "Вводная часть"],
      ["0.1", "Базы данных"],
      ["0.2", "UML-диаграммы"],
      ["0.3", "Архитектуры Back End"],
      ["0.4", "Идемпотентность"],
      ["1.0", "Регистрация"],
      ["1.1", "RBAC"],
      ["1.2", "Аутентификация"],
      ["1.3", "Авторизация"],
      ["1.4", "Просмотр данных пользователя"],
      ["1.5", "Изменение данных пользователя"],
      ["1.6", "Удаление пользователя"],
      ["1.7", "Просмотр списка всех пользователей"],
      ["2.0", "Общие требования к трансформации файлов"],
      ["2.1", "Трансформация текстовых форматов"],
      ["2.2", "Трансформация изображений"],
      ["2.3", "Просмотр истории трансформаций файлов пользователя"],
      ["2.4", "Сохранение результатов трансформаций в хранилище"]
    ].map(([id, title]) => ({
      id, title,
      file: (id + " " + title + ".md").normalize("NFC"),
      module: id[0]
    }));

    const LANG = { sh: "bash", shell: "bash", js: "javascript", py: "python", cs: "csharp", text: "plaintext", txt: "plaintext" };
    const LANG_LABEL = { javascript: "JavaScript", python: "Python", csharp: "C#", bash: "Shell", sql: "SQL", json: "JSON", plaintext: "Text", yaml: "YAML", xml: "XML" };

    const $ = (id) => document.getElementById(id);
    const nav = $("nav");
    const content = $("content");
    const outline = $("outline");
    const pager = $("pager");
    const main = $("main");
    const q = $("q");

    let fileMap = null;
    const cache = new Map();
    let currentId = "";
    let token = 0;
    let slugCounts = new Map();

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
        const known = new Set(LESSONS.map((l) => l.id));
        return {
          done: new Set((raw.done || []).filter((id) => known.has(id))),
          last: known.has(raw.last) ? raw.last : "",
          scroll: raw.scroll || {},
          theme: raw.theme === "dark" ? "dark" : "light"
        };
      } catch (e) {
        return { done: new Set(), last: "", scroll: {}, theme: "light" };
      }
    }
    const state = loadState();

    function saveState() {
      localStorage.setItem(KEY, JSON.stringify({
        done: [...state.done],
        last: state.last,
        scroll: state.scroll,
        theme: state.theme
      }));
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function slugify(text) {
      let base = text.trim().toLowerCase()
        .replace(/[^\p{L}\p{N}\s_-]/gu, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      if (!base) base = "section";
      const n = slugCounts.get(base) || 0;
      slugCounts.set(base, n + 1);
      return n ? base + "-" + n : base;
    }

    function parseHash() {
      const raw = location.hash.replace(/^#/, "");
      if (!raw) return { id: "", anchor: "" };
      const i = raw.indexOf("/");
      const id = decodeURIComponent(i === -1 ? raw : raw.slice(0, i));
      const anchor = i === -1 ? "" : decodeURIComponent(raw.slice(i + 1));
      return { id, anchor };
    }

    function setRoute(id, anchor, mode) {
      const hash = "#" + encodeURIComponent(id) + (anchor ? "/" + encodeURIComponent(anchor) : "");
      if (location.hash === hash || mode === "none") return;
      const url = location.pathname + location.search + hash;
      if (mode === "replace") history.replaceState(null, "", url);
      else history.pushState(null, "", url);
    }

    function lessonById(id) { return LESSONS.find((l) => l.id === id); }
    function moduleTitle(id) { return (MODULES.find((m) => m.id === id) || {}).title || ""; }

    function updateProgress() {
      const n = state.done.size;
      $("done-count").textContent = String(n);
      $("total-count").textContent = String(LESSONS.length);
      $("done-bar").style.width = (n / LESSONS.length * 100) + "%";
    }

    function snippet(text, query) {
      const hay = text.toLowerCase();
      const i = hay.indexOf(query.toLowerCase());
      if (i < 0) return "";
      const start = Math.max(0, i - 36);
      const end = Math.min(text.length, i + query.length + 64);
      let s = text.slice(start, end).replace(/\s+/g, " ").trim();
      if (start > 0) s = "…" + s;
      if (end < text.length) s += "…";
      const esc = escapeHtml(s);
      const re = new RegExp(escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
      return esc.replace(re, (m) => "<mark>" + m + "</mark>");
    }

    function renderNav() {
      const query = q.value.trim();
      updateProgress();
      if (query.length >= 2) {
        const items = [];
        for (const lesson of LESSONS) {
          const text = cache.get(lesson.id) || "";
          const inTitle = lesson.title.toLowerCase().includes(query.toLowerCase()) || lesson.id.includes(query);
          const hit = text ? snippet(text, query) : "";
          if (!inTitle && !hit) continue;
          items.push(lessonRow(lesson, hit));
        }
        nav.innerHTML = items.length ? items.join("") : '<p class="empty">Ничего не найдено</p>';
        return;
      }
      nav.innerHTML = MODULES.map((mod) => {
        const lessons = LESSONS.filter((l) => l.module === mod.id).map((l) => lessonRow(l)).join("");
        return '<div class="module">' + mod.title + "</div>" + lessons;
      }).join("");
      const active = nav.querySelector(".lesson.active");
      if (active) active.scrollIntoView({ block: "nearest" });
    }

    function lessonRow(lesson, hit) {
      const done = state.done.has(lesson.id) ? " done" : "";
      const active = lesson.id === currentId ? " active" : "";
      const extra = hit ? '<span class="hit">' + hit + "</span>" : "";
      return '<div class="lesson' + done + active + '" data-id="' + lesson.id + '">' +
        '<button class="mark" type="button" aria-label="Отметить пройденным" aria-pressed="' + (done ? "true" : "false") + '">' +
        '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3 8.5 6.2 11.5 13 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
        '<button class="open-btn" type="button" data-open="' + lesson.id + '"><span class="num">' + lesson.id + '</span><span>' + escapeHtml(lesson.title) + extra + "</span></button></div>";
    }

    async function loadText(lesson) {
      if (cache.has(lesson.id)) return cache.get(lesson.id);
      if (fileMap) {
        const file = fileMap.get(lesson.file);
        if (!file) throw new Error("Нет файла " + lesson.file);
        const text = await file.text();
        cache.set(lesson.id, text);
        return text;
      }
      const res = await fetch(encodeURI(lesson.file));
      if (!res.ok) throw new Error("Не удалось открыть " + lesson.file + " (" + res.status + ")");
      const text = await res.text();
      cache.set(lesson.id, text);
      return text;
    }

    function paint(lesson, text) {
      if (!window.marked) {
        content.innerHTML = "<p>Не удалось загрузить библиотеки с cdn.jsdelivr.net. Проверьте сеть и обновите страницу.</p>";
        return;
      }
      slugCounts = new Map();
      content.innerHTML = marked.parse(text, { gfm: true, breaks: false });
      content.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach((h) => { h.id = slugify(h.textContent); });
      content.querySelectorAll('a[href^="http"]').forEach((a) => {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      });
      content.querySelectorAll("pre code.language-mermaid, pre code.lang-mermaid").forEach((code) => {
        const host = document.createElement("div");
        host.className = "diagram";
        host.dataset.source = code.textContent;
        code.parentElement.replaceWith(host);
      });
      content.querySelectorAll("pre code").forEach((block) => {
        const cls = [...block.classList].find((c) => c.startsWith("language-") || c.startsWith("lang-"));
        const raw = cls ? cls.split("-").slice(1).join("-").toLowerCase() : "";
        const mapped = LANG[raw] || raw;
        if (mapped && mapped !== raw) {
          block.classList.remove(cls);
          block.classList.add("language-" + mapped);
        }
        if (window.hljs) {
          try { hljs.highlightElement(block); } catch (e) {}
        }
        const pre = block.parentElement;
        const wrap = document.createElement("div");
        wrap.className = "codeblock";
        const bar = document.createElement("div");
        bar.className = "codeblock-bar";
        const label = LANG_LABEL[mapped] || raw || "text";
        bar.innerHTML = "<span>" + escapeHtml(label) + '</span><button type="button" data-copy>Копировать</button>';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.append(bar, pre);
      });
      content.querySelectorAll("table").forEach((table) => {
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });
      const heads = [...content.querySelectorAll("h1,h2,h3")].filter((h, i) => !(i === 0 && h.tagName === "H1"));
      outline.innerHTML = heads.length
        ? '<p>На странице</p>' + heads.map((h) => {
          const d = h.tagName === "H1" ? "d1" : h.tagName === "H3" ? "d3" : "d2";
          return '<a class="' + d + '" href="#' + h.id + '">' + escapeHtml(h.textContent) + "</a>";
        }).join("")
        : "";
      const h1 = content.querySelector("h1");
      const index = LESSONS.findIndex((l) => l.id === lesson.id);
      $("crumb-module").textContent = moduleTitle(lesson.module);
      $("crumb-meta").textContent = lesson.id + " · " + (index + 1) + " / " + LESSONS.length;
      document.title = (h1 ? h1.textContent : lesson.title) + " · Back End A1";
      const doneBtn = $("done");
      const done = state.done.has(lesson.id);
      doneBtn.textContent = done ? "Пройдено" : "Отметить пройденным";
      doneBtn.classList.toggle("is-done", done);
      doneBtn.setAttribute("aria-pressed", done ? "true" : "false");
      const prev = LESSONS[index - 1];
      const next = LESSONS[index + 1];
      pager.innerHTML =
        (prev ? '<button type="button" data-go="' + prev.id + '" data-dir="prev"><small>Назад</small><strong>' + prev.id + " " + escapeHtml(prev.title) + "</strong></button>" : "<span></span>") +
        (next ? '<button type="button" class="next" data-go="' + next.id + '" data-dir="next" title="Alt + стрелка вправо"><small>Дальше</small><strong>' + next.id + " " + escapeHtml(next.title) + "</strong></button>" : "<span></span>");
      renderNav();
    }

    async function drawDiagrams(myToken) {
      if (!window.mermaid) return;
      const hosts = [...content.querySelectorAll(".diagram")];
      for (let i = 0; i < hosts.length; i++) {
        if (myToken !== token) return;
        const host = hosts[i];
        const source = host.dataset.source || "";
        const uid = "mmd" + myToken + "x" + i;
        try {
          const { svg } = await mermaid.render(uid, source);
          if (myToken !== token) return;
          host.innerHTML = svg;
        } catch (err) {
          const stray = document.getElementById(uid);
          if (stray) stray.remove();
          host.innerHTML = "<pre><code>" + escapeHtml(source) + "</code></pre><p class=\"diagram-note\">Схема не собралась</p>";
        }
      }
    }

    async function openLesson(id, opts) {
      opts = opts || {};
      const lesson = lessonById(id);
      if (!lesson) return;
      if (id === currentId && !opts.force) {
        if (opts.anchor) document.getElementById(opts.anchor)?.scrollIntoView({ block: "start" });
        return;
      }
      const myToken = ++token;
      currentId = id;
      state.last = id;
      saveState();
      if (opts.mode !== "none") setRoute(id, opts.anchor || "", opts.mode || "push");
      renderNav();
      content.innerHTML = '<p class="loading">Загрузка…</p>';
      outline.innerHTML = "";
      pager.innerHTML = "";
      try {
        const text = await loadText(lesson);
        if (myToken !== token) return;
        paint(lesson, text);
        const saved = state.scroll[id] || 0;
        if ((opts.resetScroll || !saved) && !opts.anchor) main.scrollTop = 0;
        await drawDiagrams(myToken);
        if (myToken !== token) return;
        if (opts.anchor) document.getElementById(opts.anchor)?.scrollIntoView({ block: "start" });
        else if (!opts.resetScroll && saved) main.scrollTop = saved;
      } catch (err) {
        if (myToken !== token) return;
        if (!fileMap && cache.size === 0) {
          $("gate-error").textContent = err.message || String(err);
          document.documentElement.classList.add("gate-open");
          return;
        }
        content.innerHTML = "<p>" + escapeHtml(err.message || String(err)) + "</p>";
      }
    }

    function go(dir) {
      const index = LESSONS.findIndex((l) => l.id === currentId);
      const target = LESSONS[index + dir];
      if (!target) return;
      if (dir > 0) {
        state.done.add(currentId);
        saveState();
      }
      openLesson(target.id, { mode: "push", resetScroll: true });
    }

    function applyTheme(theme) {
      state.theme = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", state.theme);
      $("hljs-light").disabled = state.theme === "dark";
      $("hljs-dark").disabled = state.theme !== "dark";
      const btn = $("theme");
      btn.textContent = state.theme === "dark" ? "Светлая" : "Тёмная";
      saveState();
    }

    function warmCache() {
      Promise.all(LESSONS.map((l) => loadText(l).catch(() => ""))).then(() => {
        if (q.value.trim().length >= 2) renderNav();
      });
    }

    nav.addEventListener("click", (e) => {
      const mark = e.target.closest(".mark");
      if (mark) {
        const id = mark.closest(".lesson").dataset.id;
        if (state.done.has(id)) state.done.delete(id); else state.done.add(id);
        saveState();
        renderNav();
        if (id === currentId) {
          const done = state.done.has(id);
          $("done").textContent = done ? "Пройдено" : "Отметить пройденным";
          $("done").classList.toggle("is-done", done);
        }
        return;
      }
      const open = e.target.closest("[data-open]");
      if (!open) return;
      openLesson(open.dataset.open, { mode: "push" });
      $("sidebar").classList.remove("open");
    });

    pager.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-go]");
      if (!btn) return;
      if (btn.dataset.dir === "next") {
        state.done.add(currentId);
        saveState();
      }
      openLesson(btn.dataset.go, { mode: "push", resetScroll: true });
    });

    content.addEventListener("click", async (e) => {
      const copy = e.target.closest("[data-copy]");
      if (copy) {
        const text = copy.closest(".codeblock").querySelector("code").innerText;
        try { await navigator.clipboard.writeText(text); }
        catch (err) {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        copy.textContent = "Скопировано";
        setTimeout(() => { copy.textContent = "Копировать"; }, 1200);
        return;
      }
      const a = e.target.closest("a");
      if (!a) return;
      const href = a.getAttribute("href") || "";
      if (!href.startsWith("#")) return;
      const id = decodeURIComponent(href.slice(1));
      const el = document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ block: "start" });
      setRoute(currentId, id, "replace");
    });

    outline.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if (!a) return;
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      const el = document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      el.scrollIntoView({ block: "start" });
      setRoute(currentId, id, "replace");
    });

    $("done").addEventListener("click", () => {
      if (!currentId) return;
      if (state.done.has(currentId)) state.done.delete(currentId); else state.done.add(currentId);
      saveState();
      renderNav();
      const done = state.done.has(currentId);
      $("done").textContent = done ? "Пройдено" : "Отметить пройденным";
      $("done").classList.toggle("is-done", done);
    });

    $("theme").addEventListener("click", () => applyTheme(state.theme === "dark" ? "light" : "dark"));
    $("menu").addEventListener("click", () => $("sidebar").classList.add("open"));
    $("backdrop").addEventListener("click", () => $("sidebar").classList.remove("open"));

    q.addEventListener("input", () => renderNav());

    let scrollTimer = 0;
    main.addEventListener("scroll", () => {
      const max = main.scrollHeight - main.clientHeight;
      $("readbar").style.width = (max > 0 ? main.scrollTop / max * 100 : 0) + "%";
      const heads = [...content.querySelectorAll("h1,h2,h3")];
      const line = main.getBoundingClientRect().top + 90;
      let current = null;
      for (const h of heads) if (h.getBoundingClientRect().top <= line) current = h;
      outline.querySelectorAll("a").forEach((a) => a.classList.toggle("active", current && a.getAttribute("href") === "#" + current.id));
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        if (!currentId) return;
        state.scroll[currentId] = main.scrollTop;
        saveState();
      }, 180);
    });

    window.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea")) return;
      if (!e.altKey) return;
      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    });

    window.addEventListener("popstate", () => {
      const { id, anchor } = parseHash();
      if (lessonById(id)) openLesson(id, { anchor, mode: "none" });
    });

    $("pick-dir").addEventListener("change", async (e) => {
      fileMap = new Map();
      for (const file of e.target.files) {
        if (file.name.toLowerCase().endsWith(".md")) fileMap.set(file.name.normalize("NFC"), file);
      }
      const found = LESSONS.some((l) => fileMap.has(l.file));
      if (!found) {
        $("gate-error").textContent = "В выбранной папке нет уроков. Укажите папку A1/New, где лежит index.html.";
        fileMap = null;
        return;
      }
      document.documentElement.classList.remove("needs-files", "gate-open");
      const { id, anchor } = parseHash();
      await openLesson(lessonById(id) ? id : (state.last || "0.0"), { anchor, mode: "replace" });
      warmCache();
    });

    applyTheme(state.theme);
    renderNav();
    if (window.mermaid) {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose",
        theme: "neutral",
        fontFamily: "Segoe UI, sans-serif",
        flowchart: { htmlLabels: true, curve: "basis" }
      });
    }
    if (location.protocol !== "file:") {
      const { id, anchor } = parseHash();
      openLesson(lessonById(id) ? id : (state.last || "0.0"), { anchor, mode: "replace" }).then(warmCache);
    }
  </script>
</body>
</html>
